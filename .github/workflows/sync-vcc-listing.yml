name: Sync VCC stable releases

'on':
  release:
    types: [published, edited, released, deleted]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-vcc-listing.yml']
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: vcc-listing-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Validate stable ZIPs and update index.json
        shell: python {0} --apply
        run: |
          import argparse
          import base64
          import copy
          import hashlib
          import io
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          
          PACKAGE = 'com.ninsa.avatar-tools'
          MAX_ZIP = 64 * 1024 * 1024
          MAX_EXPANDED = 128 * 1024 * 1024
          
          
          def stable_version(release):
              if release.get('draft') or release.get('prerelease'):
                  return None
              match = re.fullmatch(r'v?((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))', release.get('tag_name', ''))
              if not match or re.search(r'\b(alpha|beta|preview|rc|dev|nightly|canary)\b', release.get('name') or '', re.I):
                  return None
              return match[1]
          
          
          def version_key(version):
              return tuple(int(part) for part in version.split('.'))
          
          
          def inspect_zip(content):
              if len(content) > MAX_ZIP:
                  raise ValueError('Package archive exceeds 64 MB.')
              with zipfile.ZipFile(io.BytesIO(content)) as archive:
                  entries = archive.infolist()
                  names = [entry.filename for entry in entries]
                  if len(entries) > 2000 or len(names) != len(set(names)):
                      raise ValueError('Package archive has too many entries or duplicate paths.')
                  if sum(entry.file_size for entry in entries) > MAX_EXPANDED:
                      raise ValueError('Expanded archive exceeds 128 MB.')
                  for entry in entries:
                      if entry.filename.startswith('/') or '\\' in entry.filename or '..' in entry.filename.split('/') or ':' in entry.filename or entry.flag_bits & 1:
                          raise ValueError('Package archive contains an unsafe or encrypted entry.')
                  if 'package.json' not in names or 'Editor/Ninsa.AvatarTools.Editor.dll' not in names:
                      raise ValueError('Expected package.json and editor DLL at the package root.')
                  manifest = json.loads(archive.read('package.json').decode('utf-8-sig'))
                  if manifest.get('name') != PACKAGE:
                      raise ValueError('Package name does not match NINSA Avatar Tools.')
                  return manifest
          
          
          def stamp_zip(content, version):
              manifest = inspect_zip(content)
              manifest['version'] = version
              output = io.BytesIO()
              with zipfile.ZipFile(io.BytesIO(content)) as original, zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as result:
                  for entry in original.infolist():
                      data = original.read(entry)
                      if entry.filename == 'package.json':
                          data = (json.dumps(manifest, indent=2, ensure_ascii=False) + '\n').encode('utf-8')
                      result.writestr(copy.copy(entry), data)
              corrected = output.getvalue()
              if inspect_zip(corrected)['version'] != version:
                  raise ValueError('Corrected archive failed its version check.')
              return corrected
          
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError('Refusing to redirect an authenticated GitHub API request.')
          
          
          class GitHub:
              def __init__(self, repository, token):
                  if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository):
                      raise ValueError('Invalid repository identifier.')
                  self.repository = repository
                  self.prefix = '/repos/' + repository
                  self.token = token
                  self.opener = urllib.request.build_opener(NoRedirect())
          
              def api(self, method, suffix, payload=None, binary=False):
                  host = 'https://uploads.github.com' if binary else 'https://api.github.com'
                  headers = {'Accept': 'application/vnd.github+json', 'User-Agent': 'NINSA-VCC-Listing', 'X-GitHub-Api-Version': '2022-11-28'}
                  if self.token:
                      headers['Authorization'] = 'Bearer ' + self.token
                  if payload is not None:
                      if binary:
                          headers['Content-Type'] = 'application/zip'
                      else:
                          headers['Content-Type'] = 'application/json'
                          payload = json.dumps(payload).encode('utf-8')
                  request = urllib.request.Request(host + self.prefix + suffix, data=payload, headers=headers, method=method)
                  with self.opener.open(request, timeout=60) as response:
                      return json.load(response)
          
              def pages(self, suffix):
                  result = []
                  for page in range(1, 101):
                      batch = self.api('GET', suffix + ('&' if '?' in suffix else '?') + f'per_page=100&page={page}')
                      result.extend(batch)
                      if len(batch) < 100:
                          return result
                  raise ValueError('GitHub pagination limit exceeded.')
          
              def download(self, asset):
                  url = asset['browser_download_url']
                  parsed = urllib.parse.urlsplit(url)
                  if parsed.scheme != 'https' or parsed.netloc != 'github.com' or not parsed.path.startswith('/' + self.repository + '/releases/download/'):
                      raise ValueError('Release asset URL is outside this repository.')
                  if asset.get('size', 0) > MAX_ZIP:
                      raise ValueError('Release asset exceeds 64 MB.')
                  request = urllib.request.Request(url, headers={'User-Agent': 'NINSA-VCC-Listing'})
                  with urllib.request.urlopen(request, timeout=60) as response:
                      content = response.read(MAX_ZIP + 1)
                  if len(content) > MAX_ZIP:
                      raise ValueError('Downloaded archive exceeds 64 MB.')
                  digest = asset.get('digest')
                  if digest and digest != 'sha256:' + hashlib.sha256(content).hexdigest():
                      raise ValueError('Release asset checksum does not match GitHub metadata.')
                  return content
          
          
          def prepare_release(github, release, version, apply):
              assets = github.pages(f'/releases/{release["id"]}/assets')
              canonical = f'{PACKAGE}-{version}.zip'
              repaired = f'{PACKAGE}-{version}-vcc.zip'
              asset_by_name = {item['name']: item for item in assets}
          
              # Prefer the dedicated repair asset, then a correct canonical asset. A
              # wrongly versioned canonical upload is left untouched and repaired from
              # the generic source ZIP under the dedicated name.
              for candidate_name in (repaired, canonical):
                  candidate = asset_by_name.get(candidate_name)
                  if candidate is None:
                      continue
                  candidate_content = github.download(candidate)
                  candidate_manifest = inspect_zip(candidate_content)
                  if candidate_manifest.get('version') == version:
                      candidate_manifest['url'] = candidate['browser_download_url']
                      candidate_manifest['zipSHA256'] = hashlib.sha256(candidate_content).hexdigest()
                      return candidate_manifest
                  if candidate_name == repaired:
                      raise ValueError(f'{repaired} has an incorrect internal version.')
          
              asset = asset_by_name.get(PACKAGE + '.zip')
              if asset is None:
                  # Some releases contain only a wrongly versioned canonical ZIP. Use
                  # it as the source, preserve it, and publish the stamped copy under
                  # the dedicated repair name.
                  asset = asset_by_name.get(canonical)
              if asset is None:
                  print(f'{version}: waiting for a package ZIP upload.')
                  return None
              content = github.download(asset)
              manifest = inspect_zip(content)
              if manifest.get('version') != version:
                  if release.get('immutable'):
                      raise ValueError(f'{version} is immutable and its ZIP has the wrong version.')
                  content = stamp_zip(content, version)
                  print(f'{version}: creating a corrected versioned ZIP; original upload is preserved.')
                  output_name = repaired if canonical in asset_by_name else canonical
                  if apply:
                      asset = github.api('POST', f'/releases/{release["id"]}/assets?name=' + urllib.parse.quote(output_name, safe=''), content, binary=True)
                      expected = 'sha256:' + hashlib.sha256(content).hexdigest()
                      if asset.get('digest') and asset['digest'] != expected:
                          raise ValueError('Uploaded corrected archive has an unexpected checksum.')
                  else:
                      tag = urllib.parse.quote(release['tag_name'], safe='')
                      asset = {'browser_download_url': f'https://github.com/{github.repository}/releases/download/{tag}/{output_name}'}
                  manifest = inspect_zip(content)
              manifest['url'] = asset['browser_download_url']
              manifest['zipSHA256'] = hashlib.sha256(content).hexdigest()
              return manifest
          
          
          def build_versions(github, releases, apply):
              stable = [(stable_version(release), release) for release in releases]
              stable = [(version, release) for version, release in stable if version is not None]
              stable.sort(key=lambda item: (version_key(item[0]), item[1].get('published_at') or ''), reverse=True)
              versions = {}
              errors = []
              for version, release in stable:
                  if version in versions:
                      continue
                  try:
                      manifest = prepare_release(github, release, version, apply)
                      if manifest is not None:
                          versions[version] = manifest
                  except Exception as error:
                      errors.append(f'{version}: {error}')
                      print(f'::warning::{version}: {error}')
              if not versions:
                  raise ValueError('No stable release has a valid package ZIP yet.')
              return versions, errors
          
          
          def update_listing(github, versions, apply):
              branch = github.api('GET', '')['default_branch']
              suffix = '/contents/index.json'
              ref = '?ref=' + urllib.parse.quote(branch, safe='')
              for attempt in range(3):
                  current = github.api('GET', suffix + ref)
                  previous = json.loads(base64.b64decode(current['content']).decode('utf-8-sig'))
                  listing = copy.deepcopy(previous)
                  listing['url'] = f'https://raw.githubusercontent.com/{github.repository}/{branch}/index.json'
                  listing.setdefault('packages', {}).setdefault(PACKAGE, {})['versions'] = versions
                  if listing == previous:
                      print('VCC listing already matches the stable release ZIPs.')
                      return listing
                  content = (json.dumps(listing, indent=2, ensure_ascii=False) + '\n').encode('utf-8')
                  if not apply:
                      print('Dry run: would publish versions ' + ', '.join(versions))
                      return listing
                  try:
                      github.api('PUT', suffix, {'message': 'Update VCC listing from stable releases', 'branch': branch,
                                 'sha': current['sha'], 'content': base64.b64encode(content).decode('ascii')})
                      print('Published VCC versions: ' + ', '.join(versions))
                      return listing
                  except urllib.error.HTTPError as error:
                      if error.code != 409 or attempt == 2:
                          raise
              raise ValueError('VCC listing changed concurrently; retry the workflow.')
          
          
          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument('--apply', action='store_true', help='Upload corrected archives and commit index.json.')
              parser.add_argument('--output', help='Optional local copy of the generated listing.')
              args = parser.parse_args()
              token = os.environ.get('GITHUB_TOKEN', '')
              if args.apply and not token:
                  raise ValueError('GITHUB_TOKEN is required for --apply.')
              github = GitHub(os.environ.get('GITHUB_REPOSITORY', 'Ninsa-xlr/com.ninsa.avatar-tools'), token)
              versions, errors = build_versions(github, github.pages('/releases'), args.apply)
              listing = update_listing(github, versions, args.apply)
              if args.output:
                  with open(args.output, 'w', encoding='utf-8') as output:
                      json.dump(listing, output, indent=2)
                      output.write('\n')
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  with open(summary, 'a', encoding='utf-8') as output:
                      output.write('## NINSA VCC listing\n\nStable versions: ' + ', '.join(versions) + '\n')
                      if errors:
                          output.write('\nSkipped releases:\n' + '\n'.join('- ' + error for error in errors) + '\n')
              if errors:
                  raise ValueError('Some releases were skipped; see the warnings. Valid releases have been listed.')
          
          
          if __name__ == '__main__':
              try:
                  main()
              except Exception as error:
                  print(f'::error::{error}', file=sys.stderr)
                  sys.exit(1)

